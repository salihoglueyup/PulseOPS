server {
    listen 80;
    server_name musteri-a.com www.musteri-a.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name musteri-a.com;

    ssl_certificate /etc/letsencrypt/live/musteri-a.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musteri-a.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name api.musteri-a.com;

    ssl_certificate /etc/letsencrypt/live/api.musteri-a.com/fullchain.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name demo.site.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
