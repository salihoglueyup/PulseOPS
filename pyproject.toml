[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseops"
dynamic = ["version"]
description = "PulseOps (PulseTUI): Agentless Real-Time Server, Web & Infrastructure Observability TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70.0,<9",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "pydantic>=2.5.0",
    "paramiko>=3.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100",
    "prometheus-client>=0.17",
    "ruff>=0.5.0",
]

[project.scripts]
pulseops = "cli:main"
pulsetui = "cli:main"
server-tui = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main", "commands", "installer", "version", "pulseops_config", "logging_setup", "history", "notify", "exporters", "scheduler"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools.package-data]
ui = ["*.tcss", "**/*.tcss"]

[tool.setuptools.packages.find]
where = ["."]
include = ["collectors*", "models*", "ui*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["F", "E9"]
