name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import smoke test
        run: python -c "import cli, ui.app"
      - name: Pytest
        run: pytest -q

  ssh-integration:
    name: SSH integration (real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start a throwaway sshd on port 2222
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q openssh-server >/dev/null
          sudo mkdir -p /run/sshd
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/id_ci"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat "$RUNNER_TEMP/id_ci.pub" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=no -o PermitRootLogin=no
      - name: SSH integration tests (non-root user with passwordless sudo)
        env:
          PULSEOPS_TEST_SSH_PORT: "2222"
          PULSEOPS_TEST_SSH_USER: runner
          PULSEOPS_TEST_SSH_KEY: ${{ runner.temp }}/id_ci
        run: pytest -q tests/test_ssh_integration.py tests/test_ssh_security.py
      - name: systemd timer (real install, run, remove)
        run: |
          sudo env "PATH=$PATH" pulseops schedule install --every 1h \
            --args "check --demo -f json -o /var/lib/pulseops-ci/check.json"
          systemctl list-timers --no-pager pulseops-check.timer | grep -q pulseops-check.timer
          sudo systemctl start pulseops-check.service
          systemctl show pulseops-check.service -p Result -p ExecMainStatus
          test "$(systemctl show pulseops-check.service -p Result --value)" = success
          sudo python -c "import json; d = json.load(open('/var/lib/pulseops-ci/check.json')); assert d['score'] == 65, d"
          sudo env "PATH=$PATH" pulseops schedule remove
          ! systemctl cat pulseops-check.timer 2>/dev/null
      - name: Container security against real containers (runner has docker)
        env:
          PULSEOPS_TEST_DOCKER: "1"
        run: pytest -q tests/test_containers.py

  distros:
    name: Probe on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "debian:11", "debian:12",
                "almalinux:8", "almalinux:9", "alpine:3.20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bare image (no ss, ps, sudo or sshd)
        env:
          PULSEOPS_TEST_DISTROS: ${{ matrix.image }}
        run: pytest -q tests/test_distros.py
      - name: Provisioned image (ss, ps, sshd, user with sudo)
        env:
          PULSEOPS_TEST_DISTROS: ${{ matrix.image }}
          PULSEOPS_TEST_DISTRO_PROVISION: "1"
        run: pytest -q tests/test_distros.py

  ai:
    name: AI with a real Ollama (small model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start Ollama and pull a small model
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          docker exec ollama ollama pull qwen2.5:0.5b
      - name: pulseops ai against it
        env:
          PULSEOPS_TEST_OLLAMA_MODEL: "qwen2.5:0.5b"
        run: pytest -q -s tests/test_ai_live.py
