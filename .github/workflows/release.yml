name: Build and Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Yayınlanacak sürüm etiketi (ör. v1.2.0, version.py ile aynı olmalı). Boş: yalnızca derle, yayınlama."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/ci.yml

  build-linux:
    needs: test
    name: Build Linux amd64 (glibc 2.28)
    runs-on: ubuntu-latest
    # Built on AlmaLinux 8 (glibc 2.28) so the binary runs on Ubuntu 20.04+, Debian 10+ and RHEL 8+.
    # Building on ubuntu-latest would tie the bundled libpython to that runner's much newer glibc.
    container: almalinux:8
    steps:
      - name: Install build toolchain
        run: dnf install -y python3.11 python3.11-pip python3.11-devel binutils git

      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install . pyinstaller

      - name: Build with PyInstaller
        run: |
          python3.11 -m PyInstaller --noconfirm --clean --onefile \
            --name pulseops-linux-amd64 \
            --collect-all textual \
            --add-data "ui/styles.tcss:ui" \
            cli.py

      - name: Smoke test binary
        run: |
          ./dist/pulseops-linux-amd64 --version
          ./dist/pulseops-linux-amd64 status --demo
          # Demo data scores 65/100, so `check` must exit with WARNING (1)
          set +e; ./dist/pulseops-linux-amd64 check --demo; code=$?; set -e
          test "$code" -eq 1
          # Live probe inside the old-glibc container + history database (bundled sqlite3)
          export HOME="$(mktemp -d)"
          set +e; ./dist/pulseops-linux-amd64 check; code=$?; set -e
          test "$code" -le 2
          ./dist/pulseops-linux-amd64 history | tee /tmp/history.txt
          grep -q "örnek" /tmp/history.txt

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulseops-linux-amd64
          path: dist/pulseops-linux-amd64

  build:
    needs: test
    name: Build Standalone Executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: pulseops.exe
            asset_name: pulseops-windows-amd64.exe
            sep: ";"
          - os: macos-latest
            artifact_name: pulseops-macos-arm64
            asset_name: pulseops-macos-arm64
            sep: ":"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name ${{ matrix.artifact_name }} \
            --collect-all textual \
            --add-data "ui/styles.tcss${{ matrix.sep }}ui" \
            cli.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name pulseops `
            --collect-all textual `
            --add-data "ui/styles.tcss;ui" `
            cli.py
          Move-Item dist/pulseops.exe dist/${{ matrix.asset_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: [build, build-linux]
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version.py
        run: |
          expected="v$(python3 -c 'import version; print(version.__version__)')"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Tag $RELEASE_TAG does not match version.py ($expected)"; exit 1
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
